name: Build and Release JAR

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Maven
        shell: bash
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            apt-get update
            apt-get install -y maven
          fi
          mvn -version

      - name: Build JAR
        shell: bash
        run: mvn -B -DskipTests "-Dbuild.channel=${GITHUB_REF_NAME}" package

      - name: Compute release JAR path
        id: jar
        shell: bash
        run: |
          ACTUAL_JAR=$(find target -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" | sort | head -n 1)

          if [ -z "$ACTUAL_JAR" ]; then
            echo "No JAR found in target/"
            exit 1
          fi

          echo "jar_path=${ACTUAL_JAR}" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$ACTUAL_JAR")" >> "$GITHUB_OUTPUT"

          echo "Found JAR: ${ACTUAL_JAR}"

      - name: Publish Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          api_key: ${{ secrets.GITEA_TOKEN }}
          server_url: ${{ github.server_url }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          draft: false
          files: |
            ${{ steps.jar.outputs.jar_path }}