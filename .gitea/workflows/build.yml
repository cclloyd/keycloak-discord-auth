name: Build and Release JAR

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maven
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          mvn -version

      - name: Build JAR
        shell: bash
        run: mvn -B -DskipTests package

      - name: Prepare release JAR name
        id: jar
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          pom_path = Path("pom.xml")
          tag_name = os.environ["GITHUB_REF_NAME"]

          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse(pom_path).getroot()

          artifact_id = root.findtext("m:artifactId", namespaces=ns)
          keycloak_version = root.findtext("m:properties/m:keycloak.version", namespaces=ns)

          if not artifact_id:
              print("Could not read artifactId from pom.xml", file=sys.stderr)
              sys.exit(1)

          if not keycloak_version:
              print("Could not read keycloak.version from pom.xml", file=sys.stderr)
              sys.exit(1)

          search_dirs = [Path("target"), Path("dist")]
          jar_candidates = []

          for directory in search_dirs:
              if directory.exists():
                  jar_candidates.extend(
                      p for p in directory.glob("*.jar")
                      if not p.name.endswith("-sources.jar")
                      and not p.name.endswith("-javadoc.jar")
                  )

          jar_candidates = sorted(jar_candidates)

          if not jar_candidates:
              print("No JAR found in target/ or dist/", file=sys.stderr)
              sys.exit(1)

          source_jar = jar_candidates[0]
          release_name = f"{artifact_id}-{tag_name}-keycloak-{keycloak_version}.jar"
          release_path = source_jar.parent / release_name

          if source_jar.resolve() != release_path.resolve():
              shutil.copy2(source_jar, release_path)

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write(f"jar_path={release_path.as_posix()}\n")
              fh.write(f"jar_name={release_name}\n")

          print(f"Found JAR: {source_jar}")
          print(f"Release JAR: {release_path}")
          PY

      - name: Create or reuse Gitea release
        id: release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          if [ -z "$GITEA_TOKEN" ]; then
            echo "Missing secret: GITEA_TOKEN"
            exit 1
          fi

          API_URL="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases"
          TAG_NAME="${GITHUB_REF_NAME}"

          echo "Creating release for tag: $TAG_NAME"

          HTTP_STATUS=$(curl -sS -o release.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API_URL}" \
            -d "{
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"${TAG_NAME}\",
              \"draft\": false,
              \"prerelease\": false
            }")

          if [ "$HTTP_STATUS" = "201" ]; then
            echo "Release created."
          elif [ "$HTTP_STATUS" = "409" ]; then
            echo "Release already exists, fetching it."
            curl -sS \
              -H "Authorization: token ${GITEA_TOKEN}" \
              "${API_URL}/tags/${TAG_NAME}" \
              -o release.json
          else
            echo "Failed to create release. HTTP status: $HTTP_STATUS"
            cat release.json
            exit 1
          fi

          RELEASE_ID=$(python3 -c "import json; print(json.load(open('release.json'))['id'])")
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload JAR to release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          JAR_PATH="${{ steps.jar.outputs.jar_path }}"
          JAR_NAME="${{ steps.jar.outputs.jar_name }}"

          API_URL="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${JAR_NAME}"

          echo "Uploading ${JAR_NAME} to release ${RELEASE_ID}"

          curl -sS \
            -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${JAR_PATH}" \
            "${API_URL}" \
            -o upload.json

          echo "Upload completed."